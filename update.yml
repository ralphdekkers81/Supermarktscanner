name: Aanbiedingen bijwerken

on:
  schedule:
    # Maandag en woensdag rond 06:15 Nederlandse tijd (de meeste folders wisselen op ma of wo)
    - cron: "15 4 * * 1,3"
  workflow_dispatch: {}   # handmatig starten via de knop 'Run workflow'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aanbiedingen
  cancel-in-progress: false

jobs:
  scrape-en-publiceer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer afhankelijkheden
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Haal aanbiedingen op
        run: python scraper/scrape.py
        continue-on-error: true   # één kapotte winkel mag de rest niet blokkeren

      - name: Bewaar gegevens in de repository
        run: |
          git config user.name "aanbiedingen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/offers.json
          git diff --cached --quiet || git commit -m "Aanbiedingen bijgewerkt $(date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
